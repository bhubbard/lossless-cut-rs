[package]
name = "lossless-cut-rs"
version = "0.0.1"
edition = "2021"
authors = ["Brandon Hubbard <brandon@brandonhubbard.com>"]
description = "Blazingly fast, zero-overhead Rust engine for lossless video & audio surgery, inspired by mifi/lossless-cut"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bhubbard/lossless-cut-rs"
homepage = "http://code.brandonhubbard.com/lossless-cut-rs/"

[[bin]]
name = "lossless-cut"
path = "src/bin/main.rs"

[lib]
name = "lossless_cut_rs"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "cargo"] }
indicatif = { version = "0.17", features = ["tokio"] }
thiserror = "1.0"
anyhow = "1.0"
regex = "1.10"
csv = "1.3"
chrono = "0.4"
futures = "0.3"

[dev-dependencies]
tempfile = "3.12"
tokio-test = "0.4"
